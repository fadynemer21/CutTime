name: CuTime CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Firebase JSON
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json'))"
          node -e "JSON.parse(require('fs').readFileSync('.firebaserc'))"

      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile device tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug and unsigned release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/**/*.apk

  functions:
    name: Cloud Functions type-check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: functions/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm test

  firebase-rules:
    name: Firebase emulator security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: firebase-tests/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Firestore and Storage rule tests
        run: pnpm test
